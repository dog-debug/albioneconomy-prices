name: Capture Prices (Every 75 min)

on:
  schedule:
    # Run every ~75 minutes (20 runs/day, 576 runs/month × 3min = 1728 min/month)
    - cron: '0 0,1,2,3,5,6,7,8,10,11,12,13,15,16,17,18,20,21,22,23 * * *'
    - cron: '15 0,1,2,3,5,6,7,8,10,11,12,13,15,16,17,18,20,21,22,23 * * *'
    - cron: '30 0,1,2,3,5,6,7,8,10,11,12,13,15,16,17,18,20,21,22,23 * * *'
    - cron: '45 0,1,2,3,5,6,7,8,10,11,12,13,15,16,17,18,20,21,22,23 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  capture-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Capture prices from AODP
        run: node scripts/capture-prices.js

      - name: Log completion
        run: echo "Price capture completed successfully"
