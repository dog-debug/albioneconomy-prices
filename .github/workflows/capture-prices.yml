name: Capture Prices (Every 15 min)

on:
  schedule:
    # Run every 15 minutes (96 runs/day)
    # Hardcoded: :00, :15, :30, :45 of every hour
    - cron: '0 * * * *'
    - cron: '15 * * * *'
    - cron: '30 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  capture-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Capture prices from AODP
        run: node scripts/capture-prices.js

      - name: Log completion
        run: echo "Price capture completed successfully"
