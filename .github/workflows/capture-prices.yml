name: Capture Prices (Every 75 min)

on:
  schedule:
    # Run every exactly 75 minutes (20 runs/day)
    # Times: 00:00, 01:15, 02:30, 03:45, 05:00, 06:15, 07:30, 08:45, 10:00, 11:15, 12:30, 13:45, 15:00, 16:15, 17:30, 18:45, 20:00, 21:15, 22:30, 23:45
    - cron: '0 0,5,10,15,20 * * *'
    - cron: '15 1,6,11,16,21 * * *'
    - cron: '30 2,7,12,17,22 * * *'
    - cron: '45 3,8,13,18,23 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  capture-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Capture prices from AODP
        run: node scripts/capture-prices.js

      - name: Log completion
        run: echo "Price capture completed successfully"
